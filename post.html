---
layout: default
---
<main class="article-wrap">
  <div class="article-kicker">{{ page.category | upcase }}</div>
  <h1 class="article-title">{{ page.title }}</h1>
  <div class="article-meta">{{ page.date | date: "%Y.%m.%d" }} · {{ page.author | default: site.data.site.brand }}</div>
  {% if page.image %}
  <div class="article-cover"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}"></div>
  {% endif %}
  <article class="article-content">
    {{ content }}
  </article>
  {% if page.comments != false %}
  <section class="comments">
    <h3>Leave a note</h3>
    <script src="https://utteranc.es/client.js"
      repo="sayusaber-stack/sayusaber-stack.github.io"
      issue-term="pathname"
      label="comments"
      theme="github-light"
      crossorigin="anonymous"
      async></script>
  </section>
  {% endif %}
</main>
